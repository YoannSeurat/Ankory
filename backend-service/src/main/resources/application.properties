spring.application.name=ankory

spring.datasource.url=jdbc:h2:mem:ankorydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=ankoryadmin
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# le frontend statique est servi depuis frontend-client/ (les deux chemins
# couvrent un lancement depuis la racine du repo ou depuis backend-service/)
spring.web.resources.static-locations=classpath:/static/,file:../frontend-client/,file:./frontend-client/
